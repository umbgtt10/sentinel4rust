[package]
name = "sentinel4rust"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]
license = "MIT"
repository = "https://github.com/umbgtt10/sentinel4rust"
description = "Runs mutation testing around the clock on a dedicated machine and publishes each repository's surviving mutants on its own branch"
readme = "README.md"
documentation = "https://docs.rs/sentinel4rust"
keywords = ["mutation-testing", "testing", "cargo-mutants", "ci", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

