# What cargo-mutants mutates here, for a hand run and for sentinel4rust's own runs alike
# (docs/ADRs/ADR-FiltersLiveInEachRepository.md): sentinel4rust-core -- the patrol, the roster, the record on
# `mutants` and what git and cargo-mutants answer -- against core's own tests only. cli (processes, git, the file
