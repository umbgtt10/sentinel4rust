name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.stage }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only: the tool is Unix-only by design (process groups, `kill`,
        # systemd), and the cli does not compile on Windows.
        os: [ubuntu-latest]
        stage: [stage1, stage2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.stage }}

      - name: Install just
        uses: extractions/setup-just@v4

      # Not cached: these are house tools with no prebuilt binaries, and
      # caching cargo-installed binaries means `cargo install` silently
      # skips reinstalling even when a newer version is published. Always
      # installing fresh keeps CI honest about which version it gates on.
      # cargo-llvm-cov is crap4rust's coverage backend; cargo-mutants is
      # pinned, because the end-to-end gate checks that version's exit codes
      # and lists. stern4rust is not installed here: the stern gate installs
      # the commit it pins into target/stern4rust itself, with the same
      # `cargo install --git ... --rev ... --locked --root` on CI as on a
      # laptop, so the pin is written down once, in the gate.
      - name: Install gate tools
        if: matrix.stage == 'stage2'
        run: |
          cargo install --locked cargo-dry4rust
          cargo install cargo-crap4rust
          cargo install cargo-twin4rust
          cargo install cargo-iceberg4rust
          cargo install --locked cargo-shear --version 1.14.0
          cargo install cargo-llvm-cov
          cargo install --locked cargo-mutants --version 27.1.0

      - name: Run ${{ matrix.stage }}
        run: just ${{ matrix.stage }}
